name: Bug report
description: Something isn't working
labels: [bug]
assignees: [yutna]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. v1.2.0
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, runtime and tool versions
