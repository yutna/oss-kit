name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement]
assignees: [yutna]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
