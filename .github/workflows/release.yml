name: release

# Reusable. Callers trigger it on "milestone: closed". Closing a milestone
# named vX.Y.Z at 100 % is the release; any other milestone is ignored, and a
# milestone closed with open items is reopened and the run fails.
#
# A tag or release created with GITHUB_TOKEN does not trigger other workflows,
# so publishing belongs in a job of the caller with
#   needs: release
#   if: needs.release.outputs.released == 'true'
# checking out ref: ${{ needs.release.outputs.version }}.
# If publish fails, use "Re-run failed jobs": it keeps the release job's
# outputs. "Re-run all jobs" finds the release already made and skips.
#
# The run: blocks are exercised by test/release.test.mjs.
on:
  workflow_call:
    inputs:
      preflight:
        description: >-
          Shell command run on the commit about to be released, with VERSION
          (1.2.0) and TAG (v1.2.0) set. Non-zero exit reopens the milestone
          and fails. Use it to check that version files match the milestone.
        type: string
        required: false
        default: ''
    outputs:
      released:
        description: "'true' when this run created the release, else 'false'"
        value: ${{ jobs.release.outputs.released }}
      version:
        description: The release tag, e.g. v1.2.0 (empty for non-version milestones)
        value: ${{ jobs.release.outputs.version }}

permissions: {}

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      released: ${{ steps.release.outputs.released || 'false' }}
      version: ${{ steps.decide.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.milestone.number }}
    steps:
      - name: Decide whether this milestone is a release
        id: decide
        env:
          TAG: ${{ github.event.milestone.title }}
          BRANCH: ${{ github.event.repository.default_branch }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::\"$TAG\" is not a release milestone (vX.Y.Z), skipping"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

          # Read the milestone live: the event payload is a snapshot, and a
          # re-run of an old run must not release a milestone reopened or
          # renamed since (a wrong tag could never be deleted).
          live=$(gh api "repos/$REPO/milestones/$NUMBER" --jq '"\(.state) \(.open_issues) \(.title)"')
          state=${live%% *}
          rest=${live#* }
          open=${rest%% *}
          title=${rest#* }
          if [ "$title" != "$TAG" ]; then
            echo "::notice::Milestone $TAG was renamed to \"$title\" since this run started; skipping"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$state" != closed ]; then
            echo "::notice::Milestone $TAG is open; close it to release"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$open" -gt 0 ]; then
            gh api -X PATCH "repos/$REPO/milestones/$NUMBER" -f state=open --silent
            echo "::error::Milestone still has $open open items; reopened"
            exit 1
          fi

          # Idempotent: re-closing a released milestone, or a migrated repo
          # whose old milestones match existing tags, does nothing.
          # A draft with this tag was made by hand; publishing or deleting it
          # is a person's call, so stop instead of skipping silently.
          if ! draft=$(gh release view "$TAG" -R "$REPO" --json isDraft --jq .isDraft 2>&1); then
            case "$draft" in
              *"release not found"*) draft=none ;;
              *)
                echo "::error::Could not check for an existing release $TAG ($draft); re-run this workflow"
                exit 1
                ;;
            esac
          fi
          if [ "$draft" = true ]; then
            gh api -X PATCH "repos/$REPO/milestones/$NUMBER" -f state=open --silent
            echo "::error::A draft release $TAG exists: publish or delete it, then close the milestone again; reopened"
            exit 1
          fi
          if [ "$draft" = false ] || gh api "repos/$REPO/git/ref/tags/$TAG" --silent 2> /dev/null; then
            if [ "${ATTEMPT:-1}" -gt 1 ]; then
              # Never publish from here: the release may be an old tag or the
              # work of another run. "Re-run failed jobs" keeps the outputs of
              # the release job that made it, so publish runs again correctly.
              echo "::notice::$TAG already exists; to publish it again, use \"Re-run failed jobs\" on the run that created it"
            else
              echo "::notice::$TAG is already released, skipping"
            fi
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never tag newer code with a lower version, e.g. a bot's patch
          # milestone (v0.3.1) left open after a higher release (v0.4.0).
          version_lt() { # true when vA.B.C is lower than vX.Y.Z
            local a b i
            IFS=. read -r -a a <<< "${1#v}"
            IFS=. read -r -a b <<< "${2#v}"
            for i in 0 1 2; do
              if [ "${a[$i]}" -lt "${b[$i]}" ]; then return 0; fi
              if [ "${a[$i]}" -gt "${b[$i]}" ]; then return 1; fi
            done
            return 1
          }
          refs=$(gh api "repos/$REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref')
          highest=""
          for ref in $refs; do
            v=${ref#refs/tags/}
            [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            if [ -z "$highest" ] || version_lt "$highest" "$v"; then highest=$v; fi
          done
          if [ -n "$highest" ] && version_lt "$TAG" "$highest"; then
            gh api -X PATCH "repos/$REPO/milestones/$NUMBER" -f state=open --silent
            echo "::error::$TAG is lower than $highest, which is already tagged: rename this milestone (e.g. to ${highest%.*}.$(( ${highest##*.} + 1 ))) and close it again; reopened"
            exit 1
          fi

          # Pin the commit so preflight checks exactly what gets tagged.
          sha=$(gh api "repos/$REPO/commits/$BRANCH" --jq .sha)
          {
            echo "go=true"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the commit to release
        if: steps.decide.outputs.go == 'true' && inputs.preflight != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.decide.outputs.sha }}
          persist-credentials: false

      - name: Preflight
        id: preflight
        if: steps.decide.outputs.go == 'true' && inputs.preflight != ''
        env:
          TAG: ${{ steps.decide.outputs.version }}
          PREFLIGHT: ${{ inputs.preflight }}
        run: |
          VERSION="${TAG#v}"
          export VERSION TAG
          # Repository code runs here (npm ci, scripts): keep the token out of it.
          if ! env -u GH_TOKEN -u GITHUB_TOKEN bash -eo pipefail -c "$PREFLIGHT"; then
            gh api -X PATCH "repos/$REPO/milestones/$NUMBER" -f state=open --silent
            echo "::error::Preflight failed for $TAG; milestone reopened"
            exit 1
          fi

      - name: Create the release
        id: release
        if: steps.decide.outputs.go == 'true'
        env:
          TAG: ${{ steps.decide.outputs.version }}
          SHA: ${{ steps.decide.outputs.sha }}
        run: |
          gh release create "$TAG" -R "$REPO" --target "$SHA" --title "$TAG" --generate-notes
          echo "released=true" >> "$GITHUB_OUTPUT"
